<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Identity Space Explorer</title>
<style>
:root{--bg:#05070c;--panel:rgba(14,19,30,.82);--line:#26324a;--text:#e9eef7;--muted:#97a3ba;--young:#4fb3ff;--older:#ffb04f;--g30:#7dffb0;--g60:#d8ff7d;--her:#ff5fc8;--her2:#b38cff;--beam:#ffe9a8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0}canvas{display:block}
.bar{position:fixed;left:16px;right:16px;top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
.bar h1{font-size:16px;margin:0 12px 0 0;font-weight:650;letter-spacing:.02em}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on{color:var(--text);border-color:#5b6f96;box-shadow:0 0 14px #4fb3ff55}
.panel{position:fixed;left:16px;bottom:16px;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;z-index:5;backdrop-filter:blur(6px)}
.panel h2{font-size:15px;margin:0 0 6px}.panel p{margin:6px 0;color:var(--muted);font-size:13px}
.stat{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin:3px 0}.stat b{color:var(--text);font-variant-numeric:tabular-nums}
.ctl{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:12px;color:var(--muted)}.ctl input{flex:1;accent-color:#ff5fc8}
select,button.small{background:#0d1320;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px}
.legend{position:fixed;right:16px;top:60px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;z-index:5}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.label{position:fixed;transform:translate(-50%,-140%);font-size:11px;color:#dfe6f3;text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:none;white-space:nowrap;z-index:4}
.label.big{font-size:13px;font-weight:650}
.tip{position:fixed;pointer-events:none;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;display:none;font-size:12px;max-width:220px}
.tip img{display:block;width:200px;height:auto;border-radius:6px;margin-bottom:4px}
.tour{position:fixed;right:16px;bottom:16px;max-width:380px;background:var(--panel);border:1px solid #5b6f96;border-radius:14px;padding:14px 16px;z-index:6;box-shadow:0 0 24px #4fb3ff33}
.tour h3{margin:0 0 6px;font-size:15px}.tour p{margin:0 0 10px;color:#c8d2e4;font-size:13px}.tour .row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{background:#0d1320;color:var(--muted);border:0;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}.seg button.on{color:var(--text);background:#1d2a42}
@media (max-width:700px){.panel{right:16px;max-width:none}.legend{display:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>

<button class="tab" id="tourbtn" style="border-color:#ff5fc8">★ Guided tour</button></div>
<div class="tip" id="tip"></div><div class="tour" id="tour" hidden></div>

function clearView() { scene.remove(group); group = new THREE.Group(); scene.add(group); labelsEl.innerHTML = ''; labels = []; anim = null; hoverables = []; tipEl.style.display = 'none'; }
function label(text, getPos, big = false) { const el = document.createElement('div'); el.className = 'label' + (big ? ' big' : ''); el.textContent = text; labelsEl.appendChild(el); labels.push({el, getPos}); }
const panel = document.getElementById('panel'), legend = document.getElementById('legend');
let anim = null;

// ---------- view 1: identity space ----------
let hoverables = [];   // {sprite, html}
let idState = {bi: null, si: null, mode: 'pca'};
function viewIdentity(opts = {}) {
  clearView(); controls.autoRotate = opts.autoRotate ?? true; camera.position.set(0, 1.2, 7.5); controls.target.set(0, 0, 0);
  const I = DATA.identity, S = 2.0;
  const blocks = [...new Set(I.stages.map(s => s.block))], steps = [...new Set(I.stages.map(s => s.step))];
  const stage = (b, st) => I.stages.find(s => s.block === b && s.step === st);
  if (opts.block !== undefined) idState.bi = blocks.indexOf(opts.block); if (opts.step !== undefined) idState.si = steps.indexOf(opts.step);
  if (opts.mode) idState.mode = opts.mode;
  if (idState.bi === null || idState.bi < 0) idState.bi = blocks.indexOf(12); if (idState.si === null || idState.si < 0) idState.si = steps.indexOf(7);
  const sprites = I.points.map(p => { const s = glow(COL[p.group], p.group.startsWith('her') ? 0.55 : 0.36); group.add(s); return s; });
  hoverables = sprites.map((s, i) => ({sprite: s, html: `${I.points[i].img ? `<img src="${I.points[i].img}" onerror="this.remove()">` : ''}<b>${I.points[i].who}</b><br>${NAME[I.points[i].group]} · seed ${I.points[i].seed}`}));
  const cur = I.points.map(() => new THREE.Vector3()), tgt = I.points.map(() => new THREE.Vector3());
  const beamMat = new THREE.MeshBasicMaterial({color: new THREE.Color(css('--beam')), transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false});
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1, 12, 1, true), beamMat); group.add(beam);
  const beamHalo = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 1, 16, 1, true), beamMat.clone()); beamHalo.material.opacity = 0.12; group.add(beamHalo);
  // named axes (only drawn in named mode)
  const axes = new THREE.Group(); group.add(axes);
  const axDefs = [[new THREE.Vector3(1, 0, 0), 'older ← age → younger', '#7dd3ff'], [new THREE.Vector3(0, 1, 0), 'generic woman → Subject A', css('--her')], [new THREE.Vector3(0, 0, 1), 'main celebrity-identity direction', '#ffd27d']];
  for (const [d, t, c] of axDefs) { const g = new THREE.BufferGeometry().setFromPoints([d.clone().multiplyScalar(-4.2), d.clone().multiplyScalar(4.2)]);
    axes.add(new THREE.Line(g, new THREE.LineBasicMaterial({color: c, transparent: true, opacity: 0.55}))); label(t, () => d.clone().multiplyScalar(axes.visible ? 4.4 : 999)); }
  const centroid = (pred, arr) => { const v = new THREE.Vector3(); let n = 0; I.points.forEach((p, i) => { if (pred(p)) { v.add(arr[i]); n++; } }); return v.multiplyScalar(1 / Math.max(n, 1)); };
  const celebs = [...new Set(I.points.filter(p => p.group === 'young' || p.group === 'older').map(p => p.who))];
  celebs.forEach(c => label(c.split(' ').slice(-1)[0], () => centroid(p => p.who === c, cur)));
  label('Subject A', () => centroid(p => p.group === 'her_repair', cur).add(new THREE.Vector3(0, 0.25, 0)), true);
  label('generic women', () => centroid(p => p.group === 'g30' || p.group === 'g60', cur));
  function set(instant) { const s = stage(blocks[idState.bi], steps[idState.si]); const P = idState.mode === 'named' ? s.named : s.pts;
    P.forEach((p, i) => tgt[i].set(p[0] * S, p[1] * S, p[2] * S)); if (instant) cur.forEach((c, i) => c.copy(tgt[i])); axes.visible = idState.mode === 'named'; render(); }
  function render() {
    const s = stage(blocks[idState.bi], steps[idState.si]);
    panel.innerHTML = `<h2>Identity space · block ${blocks[idState.bi]}, step ${steps[idState.si]}</h2>
      <p>Each glow is one generated face: what its image tokens hold at this depth and moment. Hover a glow to see ${DATA.public ? 'who it is' : 'the face'}. Drag to orbit.</p>
      <div class="ctl">axes <span class="seg"><button data-m="pca" class="${idState.mode === 'pca' ? 'on' : ''}">largest differences (PCA)</button><button data-m="named" class="${idState.mode === 'named' ? 'on' : ''}">named: age · her · celebrity</button></span></div>
      <div class="ctl">depth <input id="b" type="range" min="0" max="${blocks.length - 1}" value="${idState.bi}"> block ${blocks[idState.bi]}</div>
      <div class="ctl">time&nbsp;&nbsp; <input id="s" type="range" min="0" max="${steps.length - 1}" value="${idState.si}"> step ${steps[idState.si]} of 8</div>
      <div class="stat"><span>Can we tell which celebrity it is?</span><b>${Math.round(s.who_acc * 100)} %</b></div>
      <div class="stat"><span>Identity kept apart from age</span><b>${Math.round(s.age_free * 100)} %</b></div>
      <div class="stat"><span>Her direction inside celebrity identity space</span><b>${(s.her_in_celeb * 100).toFixed(1)} %</b></div>
      <p>${idState.mode === 'named' ? 'Named axes: left–right is age, up is the generic-woman → Subject A direction, depth is the strongest direction that tells celebrities apart. Celebrities spread along age and identity; she rises straight up, away from both.' : 'The gold beam is her identity axis: from the generic women to her. In the deep blocks it points away from where every celebrity lives.'}</p>
      <button class="small" id="play">▶ journey through the network</button>`;
    panel.querySelector('#b').oninput = e => { idState.bi = +e.target.value; set(); };
    panel.querySelector('#s').oninput = e => { idState.si = +e.target.value; set(); };
    panel.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { idState.mode = b.dataset.m; set(); });
    panel.querySelector('#play').onclick = () => { let k = 0; const seq = steps.flatMap((_, s2) => blocks.map((_, b2) => [b2, s2])); clearInterval(window._tour);
      window._tour = setInterval(() => { if (k >= seq.length || currentView !== 'identity') return clearInterval(window._tour); [idState.bi, idState.si] = seq[k++]; set(); }, 1100); };
  }
  legend.innerHTML = Object.entries(NAME).map(([k, v]) => `<div><span class="dot" style="color:${COL[k]};background:${COL[k]}"></span>${v}</div>`).join('');
  set(true);
  anim = t => {
    cur.forEach((c, i) => { c.lerp(tgt[i], 0.08); sprites[i].position.copy(c); });
    sprites.forEach((s, i) => { if (I.points[i].group.startsWith('her')) s.scale.setScalar(0.5 + 0.08 * Math.sin(t * 3 + i)); });
    const a = centroid(p => p.group === 'g30', cur), b = centroid(p => p.group === 'her_repair', cur), d = b.clone().sub(a), L = d.length();
    for (const m of [beam, beamHalo]) { m.position.copy(a).addScaledVector(d, 0.5); m.scale.set(1, L, 1); m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); }
    beamMat.opacity = 0.45 + 0.15 * Math.sin(t * 2);
  };
}

// ---------- view 4: head atlas ----------
function viewAtlas(metric) {
  clearView(); controls.autoRotate = false; camera.position.set(0, -0.6, 9.5); controls.target.set(0, -0.6, 0);
  metric = metric || 'bind';
  const A = DATA.atlas, nb = A.own.length, nh = A.own[0].length;
  const val = (b, h) => metric === 'bind' ? A.own[b][h] - A.other[b][h] : metric === 'her' ? A.rlsa_her[b][h] : A.rlsa_others[b][h];
  let mx = 0; for (let b = 0; b < nb; b++) for (let h = 0; h < nh; h++) mx = Math.max(mx, metric === 'bind' ? val(b, h) : Math.max(A.rlsa_her[b][h], A.rlsa_others[b][h], 0.0001));
  if (metric !== 'bind') mx = Math.max(mx, ...A.own.flat()) ;  // rlsa attention on the same scale as names attract
  const W = 9.6, H = 6.2, dx = W / nh, dy = H / nb, col = metric === 'bind' ? css('--beam') : COL.her_repair;
  hoverables = [];
  for (let b = 0; b < nb; b++) for (let h = 0; h < nh; h++) {
    const v = Math.max(0, val(b, h)) / mx;
    const s = glow(col, dx * (0.6 + 2.2 * v), 0.08 + 0.92 * v); s.position.set(-W / 2 + (h + 0.5) * dx, H / 2 - (b + 0.5) * dy - 0.6, 0); group.add(s);
    hoverables.push({sprite: s, html: `<b>layer ${b}, head ${h}</b><br>own name ${A.own[b][h].toFixed(2)} · other name ${A.other[b][h].toFixed(2)}<br>“rlsa” from her face ${A.rlsa_her[b][h].toFixed(3)} · from others ${A.rlsa_others[b][h].toFixed(3)}`});
  }
  for (let b = 0; b < nb; b += 3) label(`layer ${b}`, () => new THREE.Vector3(-W / 2 - 0.45, H / 2 - (b + 0.5) * dy - 0.6, 0));
  label('heads 0 → 47', () => new THREE.Vector3(0, H / 2 - 0.25, 0));
  legend.innerHTML = `<div>Each glow is one attention head (28 layers × 48 heads). Hover for its numbers.</div>`;
  panel.innerHTML = `<h2>Head atlas</h2>
    <div class="ctl">light up <span class="seg"><button data-a="bind" class="${metric === 'bind' ? 'on' : ''}">name → own face</button><button data-a="her" class="${metric === 'her' ? 'on' : ''}">“rlsa” → her face</button><button data-a="others" class="${metric === 'others' ? 'on' : ''}">“rlsa” → other faces</button></span></div>
    <p>${metric === 'bind' ? 'How much each head sends a face to its own name rather than the other person’s (eight celebrity pairs). The binding heads form a bright band in layers 7–11; the best, layer 9 head 15, scores 0.86.' : 'How much each head sends faces to the word “rlsa”, on the same brightness scale as a name pulling its own face. The grid stays nearly dark: the binding machinery never reads rlsa as a name.'}</p>`;
  panel.querySelectorAll('[data-a]').forEach(b => b.onclick = () => viewAtlas(b.dataset.a));
  anim = t => {};
}

// ---------- view 2: name binding ----------
function viewBinding(key) {
  clearView(); controls.autoRotate = false; camera.position.set(0, 0, 8); controls.target.set(0, 0, 0);
  const B = DATA.binding, keys = Object.keys(B); key = key || keys[0];
  const sc = B[key], words = sc.words, faces = [...sc.faces].sort((a, b) => a.x - b.x);
  const wy = i => (words.length - 1) / 2 * 1.4 - i * 1.4, fy = i => (faces.length - 1) / 2 * 1.6 - i * 1.6;
  const wpos = words.map((w, i) => new THREE.Vector3(-3.2, wy(i), 0)), fpos = faces.map((f, i) => new THREE.Vector3(3.2, fy(i), 0));
  const isHer = w => w === 'rlsa';
  words.forEach((w, i) => { group.add(glow(isHer(w) ? COL.her_repair : '#9fd3ff', 0.9, 0.9)); group.children.at(-1).position.copy(wpos[i]); label(`“${w}”`, () => wpos[i], true); });
  faces.forEach((f, i) => { const c = f.looks === 'Subject A' ? COL.her_repair : f.looks === 'unknown' ? '#cfd8e8' : COL.young; const s = glow(c, 1.2); s.position.copy(fpos[i]); group.add(s);
    label(`looks like: ${f.looks}`, () => fpos[i].clone().add(new THREE.Vector3(0, 0.35, 0)), true); label(`bound to: ${f.bound}`, () => fpos[i].clone().add(new THREE.Vector3(0, -0.55, 0))); });
  const beams = [];
  faces.forEach((f, j) => words.forEach((w, i) => {
    const a = f.attn[w] || 0, mid = wpos[i].clone().lerp(fpos[j], 0.5).add(new THREE.Vector3(0, 0, 1.2));
    const curve = new THREE.QuadraticBezierCurve3(wpos[i], mid, fpos[j]);
    const mat = new THREE.MeshBasicMaterial({color: new THREE.Color(isHer(w) ? COL.her_repair : css('--beam')), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: Math.min(1, 0.15 + a * 1.4)});
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.012 + a * 0.16, 10, false), mat); group.add(m); beams.push({m, a});
    if (a > 0.005) label(a.toFixed(2), () => curve.getPoint(0.5));
  }));
  legend.innerHTML = `<div>Beam width = attention, in the 10 strongest name-binding heads (blocks 7–11), last steps.</div><div><span class="dot" style="color:${COL.her_repair};background:${COL.her_repair}"></span>the word “rlsa”</div><div><span class="dot" style="color:var(--beam);background:var(--beam)"></span>other names / phrases</div>`;
  panel.innerHTML = `<h2>Name binding</h2><p>${sc.text.replace(/^rlsa, /, '<b>rlsa</b>, ')}</p>
    <div class="ctl">scene <select id="k">${keys.map(k => `<option ${k === key ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
    <p>Celebrity faces send ~0.7 of their attention to their own name and almost none to the other: that is binding. Faces send only 0.01–0.03 to “rlsa”, so her identity is not arriving through this channel; it reaches every face another way.</p>`;
  panel.querySelector('#k').onchange = e => viewBinding(e.target.value);
  anim = t => beams.forEach((b, i) => { b.m.material.opacity = Math.min(1, 0.15 + b.a * 1.4) * (0.75 + 0.25 * Math.sin(t * 2.5 + i)); });
}

// ---------- view 3: spill ----------
function viewSpill(key, arm) {
  clearView(); controls.autoRotate = false; camera.position.set(0, 0, 7); controls.target.set(0, 0, 0);
  const D = DATA.spill, keys = Object.keys(D); key = key || 'cafe'; arm = arm || 'repair';
  const faces = D[key][arm], ref = Math.max(...D[key].repair.map(f => f.proj));
  const orbs = faces.map(f => { const k = Math.max(0.05, f.proj / ref); const c = new THREE.Color(f.subject && arm === 'repair' ? COL.her_repair : '#9fb7d8').lerp(new THREE.Color(COL.her_repair), arm === 'repair' ? k : 0);
    const s = glow(c, 0.7 + 2.2 * k); s.position.set((f.x - 0.5) * 9, (0.5 - f.y) * 6, 0); group.add(s);
    label(`${f.subject && arm === 'repair' ? 'Subject A' : 'other face'} · her-direction ${Math.round(100 * f.proj / ref)} % · looks like her ${f.likeness}`, () => s.position.clone().add(new THREE.Vector3(0, -0.6, 0))); return {s, k}; });
  const frame = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(9, 6)), new THREE.LineBasicMaterial({color: 0x26324a})); group.add(frame);
  legend.innerHTML = `<div>Glow size and pink = how much of her identity direction the face carries (block 15, last step), relative to the strongest face in the repair render.</div>`;
  panel.innerHTML = `<h2>Spill in a group shot</h2><p>Faces placed where they appear in the image (seed 181905).</p>
    <div class="ctl">scene <select id="k">${keys.map(k => `<option ${k === key ? 'selected' : ''}>${k}</option>`).join('')}</select>
    <button class="small" id="arm">${arm === 'repair' ? 'show Base' : 'show repair'}</button></div>
    <p>${arm === 'repair' ? 'With the repair, every face glows with her direction; in the cafe the strangers carry as much as she does, Rapace the least.' : 'In Base nobody carries her direction: these are the faces the strangers should have kept.'}</p>`;
  panel.querySelector('#k').onchange = e => viewSpill(e.target.value, arm);
  panel.querySelector('#arm').onclick = () => viewSpill(key, arm === 'repair' ? 'base' : 'repair');
  anim = t => orbs.forEach((o, i) => o.s.material.opacity = 0.65 + 0.35 * Math.sin(t * (1.5 + o.k * 3) + i));
}

let currentView = 'identity';
const VIEWS = {identity: o => viewIdentity(o), binding: o => viewBinding(o && o.scene), spill: o => viewSpill(o && o.scene, o && o.arm), atlas: o => viewAtlas(o && o.metric)};
function show(view, opts) { currentView = view; document.querySelectorAll('.tab[data-view]').forEach(x => x.classList.toggle('on', x.dataset.view === view)); VIEWS[view](opts || {}); }
document.querySelectorAll('.tab[data-view]').forEach(b => b.onclick = () => show(b.dataset.view));

// guided tour
const TOUR = [
  {view: 'identity', opts: {block: 12, step: 7, mode: 'pca', autoRotate: true}, title: '1 · Every face is a point', text: `Each glow is one generated face, placed by what the network holds about it in layer 12 at the last sampling step. Celebrities form two continents by age; generic women sit between them. Hover any glow to see ${DATA.public ? 'who it is' : 'the face'}.`},
  {view: 'identity', opts: {block: 4, step: 2, mode: 'pca', autoRotate: true}, title: '2 · Early and shallow, identity is blurry', text: 'Layer 4, step 2: celebrities still overlap and age is tangled with identity. Move the sliders back towards layer 12 and step 7 to watch who-is-who sharpen.'},
  {view: 'identity', opts: {block: 12, step: 7, mode: 'named', autoRotate: true}, title: '3 · She lives on her own axis', text: 'Same faces on named axes: left–right is age, depth is the main direction that tells celebrities apart, up is the generic-woman → Subject A direction. She rises straight up: only 1–3 % of her identity lies where the model keeps celebrities.'},
  {view: 'atlas', opts: {metric: 'bind'}, title: '4 · The heads that bind names', text: 'Every attention head in the network. Lit by how strongly each sends a face to its own name in photos of two celebrities: a bright band in layers 7–11. This is how the model keeps two people apart.'},
  {view: 'atlas', opts: {metric: 'her'}, title: '5 · They never read “rlsa”', text: 'Same grid, lit by how much faces attend to the word “rlsa”, on the same scale. It stays dark: the name machinery ignores the trigger.'},
  {view: 'binding', opts: {scene: 'pair: Meryl Streep + Florence Pugh'}, title: '6 · What binding looks like', text: 'Two celebrities: each name sends a thick beam to its own face and almost nothing to the other. Both are drawn correctly.'},
  {view: 'binding', opts: {scene: 'rlsa_pugh'}, title: '7 · What the trigger does instead', text: 'Subject A next to Florence Pugh: “Florence Pugh” still binds to its face, but that face looks like Subject A anyway. “rlsa” sends only hairline threads; her identity reaches every face another way.'},
  {view: 'spill', opts: {scene: 'cafe', arm: 'repair'}, title: '8 · The clone, inside the network', text: 'In the cafe, both strangers carry as much of her identity direction as she does. Toggle Base to see the faces they should have kept. The fix we are building: make “rlsa” look like a name, so this channel carries her to one face only.'}];
const tourEl = document.getElementById('tour'); let tourIdx = -1;
function tourStep(i) { tourIdx = i; const t = TOUR[i]; show(t.view, t.opts); tourEl.hidden = false;
  tourEl.innerHTML = `<h3>${t.title}</h3><p>${t.text}</p><div class="row"><button class="small" id="tp" ${i === 0 ? 'disabled' : ''}>← back</button><span style="color:var(--muted);font-size:12px">${i + 1} / ${TOUR.length}</span>${i < TOUR.length - 1 ? '<button class="small" id="tn">next →</button>' : '<button class="small" id="tx">finish</button>'}</div>`;
  tourEl.querySelector('#tp').onclick = () => tourStep(Math.max(0, i - 1)); const n = tourEl.querySelector('#tn'); if (n) n.onclick = () => tourStep(i + 1);
  const x = tourEl.querySelector('#tx'); if (x) x.onclick = () => { tourEl.hidden = true; }; }
document.getElementById('tourbtn').onclick = () => tourStep(0);

// hover tooltips
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let mouseXY = null;
addEventListener('pointermove', e => { mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); mouseXY = [e.clientX, e.clientY]; });
function hoverTest() {
  if (!mouseXY || !hoverables.length) { tipEl.style.display = 'none'; return; }
  ray.setFromCamera(mouse, camera); const hits = ray.intersectObjects(hoverables.map(h => h.sprite), false);
  if (!hits.length) { tipEl.style.display = 'none'; return; }
  const h = hoverables.find(x => x.sprite === hits[0].object);
  if (tipEl.dataset.k !== h.html) { tipEl.innerHTML = h.html; tipEl.dataset.k = h.html; }
  tipEl.style.display = 'block'; tipEl.style.left = Math.min(innerWidth - 230, mouseXY[0] + 14) + 'px'; tipEl.style.top = Math.min(innerHeight - 200, mouseXY[1] + 14) + 'px';
}
show('identity');
const clock = new THREE.Clock(), v = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime(); if (anim) anim(t); controls.update(); renderer.render(scene, camera); hoverTest();
  for (const L of labels) { v.copy(L.getPos()).project(camera); const vis = v.z < 1 && Math.abs(v.x) < 1.2 && Math.abs(v.y) < 1.2; L.el.style.display = vis ? 'block' : 'none';
    L.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; L.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; }
});
</script>
</body>
</html>
