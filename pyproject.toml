[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matlowai-detangle"
version = "0.1.0"
description = "A small, inspectable conditional LoRA repair experiment"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MatlowAI"}]
dependencies = ["torch>=2.1", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["Pillow>=10"]

[project.scripts]
detangle = "delta_surgery_seed.cli:main"
delta-surgery = "delta_surgery_seed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
